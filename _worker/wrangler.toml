# GT-Apps contact form Worker. Deploy: see ../_docs/contact-form-worker.md
name = "gt-apps-forms"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "63fa8644513f5df90ba0a30df1de92cc"   # GT-Apps Cloudflare account

# Served only on its own custom domain (Cloudflare creates the DNS record).
# The site's own records stay DNS-only on GitHub Pages.
workers_dev = false
preview_urls = false
routes = [{ pattern = "forms.gt-apps.co.uk", custom_domain = true }]

# No request logs kept: messages pass through and are not stored.
[observability]
enabled = false

[vars]
ALLOWED_ORIGINS = "https://gt-apps.co.uk,https://www.gt-apps.co.uk"
TURNSTILE_HOSTNAMES = "gt-apps.co.uk,www.gt-apps.co.uk"
SENDER = "forms@gt-apps.co.uk"
SUPPORT_TO = "support@gt-apps.co.uk"
ENQUIRIES_TO = "enquiries@gt-apps.co.uk"

# Per visitor IP: at most 3 messages a minute.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

# Secrets (wrangler secret put NAME; values in 1Password, GT-Apps vault):
#   TURNSTILE_SECRET     "Cloudflare Turnstile: gt-apps.co.uk contact form" / credential
#   GRAPH_TENANT_ID      "Microsoft Graph: website contact form sender" / tenant id
#   GRAPH_CLIENT_ID      same item / client id
#   GRAPH_CLIENT_SECRET  same item / credential (expires: rotate before the date in the item)
